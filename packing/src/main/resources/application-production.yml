spring:
  config:
    activate:
      on-profile: production

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true

sticker:
  storage:
    path: ${STICKER_STORAGE_PATH:/app/data/stickers}

app:
  jwt:
    secret: ${JWT_SECRET}

  security:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
    cookie-secure: true
    cookie-same-site: ${APP_AUTH_COOKIE_SAME_SITE:None}

logging:
  level:
    root: WARN
    com.alsorg: INFO

zoho:
  inventory:
    enabled: true
    base-url: ${ZOHO_BASE_URL:https://www.zohoapis.in}
    organization-id: ${ZOHO_ORG_ID:}
    client-id: ${ZOHO_CLIENT_ID:}
    client-secret: ${ZOHO_CLIENT_SECRET:}
    refresh-token: ${ZOHO_REFRESH_TOKEN:}
