spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alsorg_packing}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  forward-headers-strategy: framework
  address: 0.0.0.0
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.alsorg: DEBUG
    org.springframework.security: DEBUG

sticker:
  logo:
    path: ${STICKER_LOGO_PATH:D:/Nikhil/2025/alsorg-packing/packing/logo/images (1).png}
  storage:
    path: ${STICKER_STORAGE_PATH:D:/Nikhil/2025/alsorg-packing/packing/stickers}

app:
  jwt:
    secret: ${JWT_SECRET:LOCAL_DEV_SECRET_CHANGE_ME_1234567890_ABCDEF}
    expiry-ms: ${JWT_EXPIRY_MS:28800000}

  mail:
    from: ${MAIL_FROM:no-reply@alsorg.com}
    reply-to: ${MAIL_REPLY_TO:${MAIL_USERNAME:no-reply@alsorg.com}}