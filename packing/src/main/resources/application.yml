spring:
  application:
    name: AlsorgPackingPlatform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jackson:
    time-zone: Asia/Kolkata

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Kolkata

server:
  forward-headers-strategy: framework
  address: 0.0.0.0
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.alsorg: INFO
    org.springframework.security: INFO

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-ms: ${JWT_EXPIRY_MS:28800000}

  mail:
    from: ${MAIL_FROM:no-reply@alsorg.com}
    reply-to: ${MAIL_REPLY_TO:${MAIL_USERNAME:no-reply@alsorg.com}}

sticker:
  logo:
    path: ${STICKER_LOGO_PATH:}
  storage:
    path: ${STICKER_STORAGE_PATH:./stickers}

zoho:
  inventory:
    base-url: ${ZOHO_BASE_URL:https://www.zohoapis.in}
    organization-id: ${ZOHO_ORG_ID:}
    client-id: ${ZOHO_CLIENT_ID:}
    client-secret: ${ZOHO_CLIENT_SECRET:}
    refresh-token: ${ZOHO_REFRESH_TOKEN:}