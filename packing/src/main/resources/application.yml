spring:
  application:
    name: AlsorgPackingPlatform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  lifecycle:
    timeout-per-shutdown-phase: 30s

  jackson:
    time-zone: Asia/Kolkata

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Kolkata
        order_inserts: true
        order_updates: true
        jdbc.batch_size: 50

server:
  shutdown: graceful
  forward-headers-strategy: framework
  address: 0.0.0.0
  port: ${PORT:8080}
  max-http-request-header-size: 32KB

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

  compression:
    enabled: true
    min-response-size: 2048
    mime-types:
      - application/json
      - application/javascript
      - text/html
      - text/plain
      - text/css
      - text/csv
      - application/xml
      - text/xml

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
  level:
    root: INFO
    com.alsorg: INFO
    org.springframework.security: INFO

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-ms: ${JWT_EXPIRY_MS:28800000}
    clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:30}
    issuer: ${JWT_ISSUER:flowsuite}
    audience: ${JWT_AUDIENCE:flowsuite-clients}

  security:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://alsorg-packing-frontend.onrender.com}
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${APP_AUTH_COOKIE_SAME_SITE:Lax}

    login:
      max-failures-per-principal: ${LOGIN_MAX_FAILURES_PER_PRINCIPAL:8}
      max-failures-per-ip: ${LOGIN_MAX_FAILURES_PER_IP:40}
      window-seconds: ${LOGIN_WINDOW_SECONDS:900}
      block-seconds: ${LOGIN_BLOCK_SECONDS:900}

  mail:
    from: ${MAIL_FROM:no-reply@alsorg.com}
    reply-to: ${MAIL_REPLY_TO:${MAIL_USERNAME:no-reply@alsorg.com}}

sticker:
  logo:
    path: ${STICKER_LOGO_PATH:}
  storage:
    path: ${STICKER_STORAGE_PATH:./data/stickers}

zoho:
  inventory:
    base-url: ${ZOHO_BASE_URL:https://www.zohoapis.in}
    organization-id: ${ZOHO_ORG_ID:}
    client-id: ${ZOHO_CLIENT_ID:}
    client-secret: ${ZOHO_CLIENT_SECRET:}
    refresh-token: ${ZOHO_REFRESH_TOKEN:}
