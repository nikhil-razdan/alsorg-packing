# Local compatibility properties only.
# Render uses application.yml + application-render.yml.
spring.application.name=AlsorgPackingPlatform
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.forward-headers-strategy=framework

sticker.logo.path=${STICKER_LOGO_PATH:}
sticker.storage.path=${STICKER_STORAGE_PATH:./data/stickers}
