spring:
  config:
    activate:
      on-profile: staging

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false

sticker:
  storage:
    path: ${STICKER_STORAGE_PATH:/app/data/stickers}

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${APP_AUTH_COOKIE_SECURE:false}

app:
  jwt:
    secret: ${JWT_SECRET}

  security:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${APP_AUTH_COOKIE_SAME_SITE:Lax}

zoho:
  inventory:
    base-url: ${ZOHO_BASE_URL:https://www.zohoapis.in}
    organization-id: ${ZOHO_ORG_ID:}
    client-id: ${ZOHO_CLIENT_ID:}
    client-secret: ${ZOHO_CLIENT_SECRET:}
    refresh-token: ${ZOHO_REFRESH_TOKEN:}
