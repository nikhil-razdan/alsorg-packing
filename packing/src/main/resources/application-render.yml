# =====================
# RENDER ENVIRONMENT
# =====================

spring:
  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000  

# =====================
# MAIL
# =====================

app:
  mail:
    from: ${MAIL_FROM}
    reply-to: ${MAIL_REPLY_TO:${MAIL_USERNAME}}   
# =====================
# SERVER
# =====================

server:
  forward-headers-strategy: framework
  address: 0.0.0.0
  port: ${PORT:8080}

  servlet:
    session:
      cookie:
        name: ALSORG_SESSION
        secure: true
        http-only: true
        same-site: none


# =====================
# STICKER STORAGE
# =====================

sticker:
  storage:
    path: /data/stickers

# =====================
# ZOHO (OPTIONAL – ENABLE LATER)
# =====================

zoho:
  inventory:
    base-url: https://www.zohoapis.in
    organization-id: ${ZOHO_ORG_ID}
    client-id: ${ZOHO_CLIENT_ID}
    client-secret: ${ZOHO_CLIENT_SECRET}
    refresh-token: ${ZOHO_REFRESH_TOKEN}