spring:
  config:
    activate:
      on-profile: render

  jackson:
    time-zone: Asia/Kolkata

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1500000}
      keepalive-time: ${DB_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:0}
      data-source-properties:
        reWriteBatchedInserts: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Kolkata
          batch_size: 50
        order_inserts: true
        order_updates: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            checkserveridentity: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  forward-headers-strategy: framework
  address: 0.0.0.0
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.alsorg: INFO
    org.springframework.security: INFO

sticker:
  logo:
    path: ${STICKER_LOGO_PATH:}
  storage:
    # Mount a Render persistent disk at /app/data if this filesystem storage
    # contains business-critical files. Object storage is the Phase 4 target.
    path: ${STICKER_STORAGE_PATH:/app/data/stickers}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-ms: ${JWT_EXPIRY_MS:28800000}
    clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:30}
    issuer: ${JWT_ISSUER:flowsuite}
    audience: ${JWT_AUDIENCE:flowsuite-clients}

  security:
    # Keep this exact. Add custom frontend domains explicitly, comma-separated.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://alsorg-packing-frontend.onrender.com}
    cookie-secure: true

    # Current frontend/backend are cross-origin, therefore None is retained.
    # Exact-origin protection in TrustedOriginFilter is mandatory with this.
    cookie-same-site: ${APP_AUTH_COOKIE_SAME_SITE:None}

    login:
      max-failures-per-principal: ${LOGIN_MAX_FAILURES_PER_PRINCIPAL:8}
      max-failures-per-ip: ${LOGIN_MAX_FAILURES_PER_IP:40}
      window-seconds: ${LOGIN_WINDOW_SECONDS:900}
      block-seconds: ${LOGIN_BLOCK_SECONDS:900}

  mail:
    from: ${MAIL_FROM:no-reply@alsorg.com}
    reply-to: ${MAIL_REPLY_TO:${MAIL_USERNAME:no-reply@alsorg.com}}

hrflow:
  crypto-key-base64: ${HRFLOW_CRYPTO_KEY_BASE64}
