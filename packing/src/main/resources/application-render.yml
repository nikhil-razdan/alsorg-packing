spring:
  config:
    activate:
      on-profile: render

  jackson:
    time-zone: Asia/Kolkata

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Kolkata

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  forward-headers-strategy: framework
  address: 0.0.0.0
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.alsorg: INFO
    org.springframework.security: INFO

sticker:
  logo:
    path: ${STICKER_LOGO_PATH:}
  storage:
    path: ${STICKER_STORAGE_PATH:/data/stickers}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-ms: ${JWT_EXPIRY_MS:28800000}

  mail:
    from: ${MAIL_FROM:no-reply@alsorg.com}
    reply-to: ${MAIL_REPLY_TO:${MAIL_USERNAME:no-reply@alsorg.com}}